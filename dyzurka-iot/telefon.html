<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Nurse QR — Skaner i Pomiary | APEX IoT</title>
  <link rel="icon" type="image/png" href="../favicon_wc.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <div class="mobile-container">
    <!-- Ekran logowania mobilnego -->
    <div id="mob-login" class="panel" style="margin-top:20px;">
      <h2 style="margin-top:0; color:var(--accent);">📱 Mobile Nurse QR</h2>
      <p style="font-size:0.85rem; color:var(--muted);">Zaloguj się, aby skanować opaski pacjentów i wysyłać pomiary na tablicę dyżurki.</p>
      <div style="margin-bottom:10px;">
        <label>Profil pracownika:</label>
        <select id="mob-user">
          <option value="dyzurka">Piel. Anna K. (Pielęgniarka)</option>
          <option value="lekarz">Lek. Piotr N. (Lekarz Dyżurny)</option>
          <option value="opiekun">Opiekun Janusz B. (Opiekun)</option>
        </select>
      </div>
      <div style="margin-bottom:14px;">
        <label>Kod PIN (demo: 2222 pielęgniarka | 1111 lekarz | 3333 opiekun):</label>
        <input type="password" id="mob-pin" value="2222" placeholder="Wpisz PIN...">
      </div>
      <button class="btn" style="width:100%; justify-content:center;" onclick="mobLogin()">🔐 Zaloguj do Skanera</button>
    </div>

    <!-- Główny ekran pomiarów na telefonie -->
    <div id="mob-app" class="hidden">
      <div class="top-bar">
        <div>
          <h1 style="font-size:1.1rem;">📱 Skaner Opaski QR</h1>
          <span id="mob-badge" style="font-size:0.78rem; color:var(--accent);">Pracownik</span>
        </div>
        <div style="display:flex; gap:6px;">
          <a href="index.html" class="btn btn-sm btn-outline">🖥️ Tablica</a>
          <button class="btn btn-sm btn-outline" onclick="location.reload()">🔒 Wyloguj</button>
        </div>
      </div>

      <div class="panel">
        <label>1. Zeskanuj kod QR opaski lub wybierz pacjenta:</label>
        <div style="display:flex; gap:8px; margin-bottom:10px;">
          <select id="mob-patient" onchange="updateSelectedInfo()"></select>
          <button class="btn btn-green" onclick="simulateQrScan()">📷 Skan QR</button>
        </div>
        
        <!-- Szybkie wprowadzanie bezdotykowe: Głos + Zdjęcie ekranu miernika -->
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:10px;">
          <button type="button" id="btn-voice-input" class="btn" style="background:#8b5cf6; color:#fff; justify-content:center;" onclick="startVoiceDictation()">🎙️ Dyktuj wpis</button>
          <label class="btn" style="background:#0284c7; color:#fff; justify-content:center; cursor:pointer; margin:0;">
            📸 Zrób zdjęcie ekranu
            <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="scanDeviceScreen(this)">
          </label>
        </div>
        <div id="smart-input-status" class="hidden note-box" style="margin-bottom:10px; border-left-color:#8b5cf6;"></div>

        
        <div id="mob-pat-info" class="note-box" style="margin-bottom:12px;">Wybierz pacjenta...</div>

        <label>2. Parametry z ciśnieniomierza i termometru:</label>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;">
          <div><label>Ciśnienie Górne (SYS)</label><input type="number" id="in-sys" value="125"></div>
          <div><label>Ciśnienie Dolne (DIA)</label><input type="number" id="in-dia" value="80"></div>
          <div><label>Puls (bpm)</label><input type="number" id="in-pulse" value="74"></div>
          <div><label>Temperatura (°C)</label><input type="number" step="0.1" id="in-temp" value="36.7"></div>
        </div>

        <div style="margin-bottom:12px;">
          <label>3. Dodatkowy komentarz pielęgniarski (opcjonalnie):</label>
          <input id="in-comment" placeholder="np. Po podaniu leków, stan stabilny...">
        </div>

        <button class="btn btn-green" style="width:100%; justify-content:center; padding:12px; font-size:1rem;" onclick="sendVitals()">📡 Wyślij Pomiar na Tablicę</button>
        <div id="ai-feedback-banner" class="hidden note-box" style="margin-top:12px; border-left-color:var(--green);"></div>
      </div>
    </div>
  </div>
  <script src="db.js?v=10"></script>
  <script>
    let mobUser = null;
    let mobState = null;

    function nowStamp() {
      const d = new Date();
      const pad = n => String(n).padStart(2, "0");
      return `${pad(d.getDate())}.${pad(d.getMonth() + 1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    async function initMobLogin() {
      
      WardDB.trackVisit("Otwarcie skanera QR (Telefon)");
      
      mobState = await WardDB.load();
      const sel = document.getElementById("mob-user");
      if (!sel || !mobState.users) return;
      sel.innerHTML = Object.entries(mobState.users)
        .map(([key, u]) => `<option value="${key}">${u.name} (${u.label})</option>`)
        .join("");
    }

    window.addEventListener("DOMContentLoaded", initMobLogin);

    async function mobLogin() {
      if (!mobState) mobState = await WardDB.load();
      const uKey = document.getElementById("mob-user").value;
      const pin = document.getElementById("mob-pin").value.trim();
      const usersMap = mobState.users || USERS;
      const user = usersMap[uKey];
      if (!user || user.pin !== pin) return alert("Błędny kod PIN!");

      mobUser = user;
      WardDB.trackVisit("Logowanie do Skanera QR", `${user.name} (${user.label})`);

      
      document.getElementById("mob-login").classList.add("hidden");
      document.getElementById("mob-app").classList.remove("hidden");
      document.getElementById("mob-badge").textContent = `${user.name} (${user.label})`;
      await loadPatientsList();
    }

    async function loadPatientsList() {
      mobState = await WardDB.load();
      const sel = document.getElementById("mob-patient");
      sel.innerHTML = mobState.patients.map(p => `<option value="${p.id}">${p.room} / ${p.bed} — ${p.name} [${p.qr}]</option>`).join("");
      updateSelectedInfo();
    }

    function updateSelectedInfo() {
      const id = document.getElementById("mob-patient").value;
      const pat = mobState.patients.find(p => p.id === id);
      if (!pat) return;
      document.getElementById("mob-pat-info").innerHTML = `<strong>Opaska:</strong> ${pat.qr} • <strong>Zalecenie:</strong> ${pat.alertNote || "brak"}<br><strong>Leki:</strong> ${pat.medications || "brak"}`;
    }

    function simulateQrScan() {
      const sel = document.getElementById("mob-patient");
      if (sel.options.length > 1) {
        sel.selectedIndex = (sel.selectedIndex + 1) % sel.options.length;
        updateSelectedInfo();
      }
      alert("📷 Zeskanowano opaskę QR pacjenta! Przypisano stanowisko.");
    }

    function analyzeTrendWithAI(pat, sys, dia, pulse, temp) {
      const prevList = pat.history.filter(h => h.type === "pomiar");
      const prev = prevList.length ? prevList[prevList.length - 1] : null;
      const alerts = [];

      if (temp >= 38.0) alerts.push(`Gorączka ${temp}°C (przekroczony próg 38.0°C)`);
      if (sys >= 150 || dia >= 95) alerts.push(`Podwyższone ciśnienie ${sys}/${dia} mmHg`);
      if (pulse >= 100) alerts.push(`Tachykardia — puls ${pulse} bpm`);

      if (prev) {
        const diffSys = sys - prev.sys;
        const diffTemp = +(temp - prev.temp).toFixed(1);
        if (diffSys >= 15) alerts.push(`Nagły wzrost RR skurczowego o +${diffSys} mmHg względem poprzedniego pomiaru`);
        if (diffTemp >= 0.5) alerts.push(`Gwałtowny wzrost temperatury o +${diffTemp}°C`);
      }

      if (alerts.length > 0) {
        return { isAlert: true, text: `⚠️ AI Alert: ${alerts.join(" | ")} — zalecana konsultacja lekarska.` };
      }
      return { isAlert: false, text: `✅ AI: Parametry stabilne i zgodne z trendem pacjenta.` };
    }

    async function sendVitals() {
      const id = document.getElementById("mob-patient").value;
      const pat = mobState.patients.find(p => p.id === id);
      const sys = parseInt(document.getElementById("in-sys").value, 10);
      const dia = parseInt(document.getElementById("in-dia").value, 10);
      const pulse = parseInt(document.getElementById("in-pulse").value, 10);
      const temp = parseFloat(document.getElementById("in-temp").value);
      const userComment = document.getElementById("in-comment").value.trim();

      const aiAnalysis = analyzeTrendWithAI(pat, sys, dia, pulse, temp);
      const fullComment = userComment ? `${userComment} | ${aiAnalysis.text}` : aiAnalysis.text;
      const stamp = nowStamp();

      pat.history.push({ date: stamp, type: "pomiar", sys, dia, pulse, temp, author: mobUser.name, comment: fullComment });
      mobState.logs.unshift({
        time: stamp,
        text: `${mobUser.name} zapisała pomiar dla ${pat.name} (${pat.room}/${pat.bed}): RR ${sys}/${dia}, Temp ${temp}°C. ${aiAnalysis.isAlert ? aiAnalysis.text : ""}`,
        alert: aiAnalysis.isAlert
      });

      await WardDB.save(mobState);
      const banner = document.getElementById("ai-feedback-banner");
      banner.classList.remove("hidden");
      banner.style.borderLeftColor = aiAnalysis.isAlert ? "var(--red)" : "var(--green)";
      banner.innerHTML = `<strong>📡 Wysłano na tablicę dyżurki!</strong><br>${aiAnalysis.text}`;
      document.getElementById("in-comment").value = "";
    }
    function showSmartStatus(html, color = "#8b5cf6") {
      const box = document.getElementById("smart-input-status");
      if (!box) return;
      box.classList.remove("hidden");
      box.style.borderLeftColor = color;
      box.innerHTML = html;
    }

    function matchPatientFromSpeech(text) {
      const lower = text.toLowerCase();
      const roomMatch = lower.match(/(?:sala|sali|pokój)\s*(\d{3})/) || lower.match(/\b(404|405|406|407|408|413|414)\b/);
      const roomNum = roomMatch ? roomMatch[1] : null;

      let bestPat = null;
      for (const p of mobState.patients) {
        const cleanName = p.name.replace(/\(.*?\)/g, "").trim().toLowerCase(); // np. "tomasz w."
        const parts = cleanName.split(/\s+/);
        const firstName = parts[0] || "";
        const lastInit = (parts[1] || "").replace(".", "");
        const patRoomNum = (p.room.match(/\d{3}/) || [])[0];

        // 1. Dopasowanie Imię + Numer Sali (np. "Tomasz sala 405")
        if (firstName && roomNum && lower.includes(firstName) && patRoomNum === roomNum) {
          return p;
        }
        // 2. Dopasowanie Imię + Litera nazwiska (np. "Tomasz W")
        if (firstName && lastInit && new RegExp(`\\b${firstName}\\s+${lastInit}\\b`, "i").test(lower)) {
          bestPat = p;
        }
        // 3. Samo imię lub sam numer sali jako rezerwa
        if (!bestPat && firstName && new RegExp(`\\b${firstName}\\b`, "i").test(lower)) {
          bestPat = p;
        }
        if (!bestPat && roomNum && patRoomNum === roomNum) {
          bestPat = p;
        }
      }
      return bestPat;
    }

    function parseVoiceCommand(transcript) {
      const text = transcript.trim();
      const lower = text.toLowerCase();
      const summary = [];

      // 1. Dopasowanie pacjenta
      const pat = matchPatientFromSpeech(text);
      if (pat) {
        document.getElementById("mob-patient").value = pat.id;
        updateSelectedInfo();
        summary.push(`👤 Pacjent: <strong>${pat.name} (${pat.room})</strong>`);
      }

      // 2. Ciśnienie (np. "ciśnienie 125 na 80" lub "125/80")
      const bpMatch = lower.match(/(?:ciśnienie\s*)?(\d{2,3})\s*(?:na|\/|-)\s*(\d{2,3})/);
      if (bpMatch) {
        let v1 = parseInt(bpMatch[1], 10);
        let v2 = parseInt(bpMatch[2], 10);
        if (v1 < v2) [v1, v2] = [v2, v1];
        document.getElementById("in-sys").value = v1;
        document.getElementById("in-dia").value = v2;
        summary.push(`💓 RR: <strong>${v1}/${v2}</strong>`);
      }

      // 3. Puls (np. "puls 74" lub "tętno 82")
      const pulseMatch = lower.match(/(?:puls|tętno)\s*(\d{2,3})/);
      if (pulseMatch) {
        document.getElementById("in-pulse").value = parseInt(pulseMatch[1], 10);
        summary.push(`📈 Puls: <strong>${pulseMatch[1]}</strong>`);
      }

      // 4. Temperatura (np. "temperatura 37,8" lub "38.2 stopnia")
      const tempMatch = lower.match(/(?:temperatura|temp\.?)\s*(\d{2})[.,](\d)/) || lower.match(/\b(3[5-9]|4[0-2])[.,](\d)\b/);
      if (tempMatch) {
        const tempVal = `${tempMatch[1]}.${tempMatch[2]}`;
        document.getElementById("in-temp").value = tempVal;
        summary.push(`🌡️ Temp: <strong>${tempVal}°C</strong>`);
      }

      // 5. Zabieg / podany lek (wszystko po słowach kluczowych lub cały komunikat jako notatka)
      const actionMatch = text.match(/(?:podano|kroplówka|lek|zabieg|uwaga|komentarz)\s+(.+)/i);
      const commentTxt = actionMatch ? `🎙️ Podano/Zabieg: ${actionMatch[1]}` : `🎙️ Wpis głosowy: "${text}"`;
      document.getElementById("in-comment").value = commentTxt;
      summary.push(`📝 Notatka: <strong>${commentTxt}</strong>`);

      showSmartStatus(`<strong>🎙️ Rozpoznano mowę:</strong> „${text}”<br>${summary.join(" • ")}`, "#8b5cf6");
    }

    function startVoiceDictation() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) return alert("Twoja przeglądarka nie obsługuje rozpoznawania mowy. Użyj Chrome na Androidzie lub Safari na iOS.");

      const rec = new SpeechRec();
      rec.lang = "pl-PL";
      rec.interimResults = false;
      rec.maxAlternatives = 1;

      const btn = document.getElementById("btn-voice-input");
      btn.textContent = "🔴 Słucham... Mów teraz!";
      showSmartStatus("🎙️ <strong>Słucham...</strong> Powiedz np.: <em>„Tomasz sala 405, ciśnienie 125 na 80, puls 74, podano Solu-Medrol 125 mg”</em>", "#ef4444");

      rec.onresult = (ev) => {
        const transcript = ev.results[0][0].transcript;
        parseVoiceCommand(transcript);
      };
      rec.onerror = (ev) => {
        showSmartStatus(`⚠️ Błąd mikrofonu: ${ev.error}. Sprawdź uprawnienia przeglądarki.`, "#ef4444");
      };
      rec.onend = () => {
        btn.textContent = "🎙️ Dyktuj wpis";
      };
      rec.start();
    }

function preprocessImageForOCR(file) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const isPortrait = img.height > img.width;
      const targetWidth = 640;
      const rawW = isPortrait ? img.height : img.width;
      const rawH = isPortrait ? img.width : img.height;
      const scale = targetWidth / rawW;

      const canvas = document.createElement("canvas");
      canvas.width = targetWidth;
      canvas.height = Math.round(rawH * scale);

      const ctx = canvas.getContext("2d");
      if (isPortrait) {
        ctx.translate(0, canvas.height);
        ctx.rotate(-Math.PI / 2);
        ctx.drawImage(img, 0, 0, canvas.height, canvas.width);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      } else {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      }

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      for (let i = 0; i < data.length; i += 4) {
        const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        const bin = gray > 135 ? 255 : 0;
        data[i] = bin;
        data[i + 1] = bin;
        data[i + 2] = bin;
      }

      ctx.putImageData(imgData, 0, 0);
      resolve(canvas.toDataURL("image/png"));
    };
    img.src = URL.createObjectURL(file);
  });
}

async function scanDeviceScreen(input) {
  const file = input.files && input.files[0];
  if (!file) return;

  showSmartStatus("📸 <strong>Przetwarzam obraz termometru...</strong>", "#0284c7");

  try {
    const processedDataUrl = await preprocessImageForOCR(file);
    const result = await Tesseract.recognize(processedDataUrl, "eng", {
      tessedit_char_whitelist: "0123456789.,"
    });

    const raw = (result.data.text || "").replace(/\s+/g, "");
    let tempVal = null;

    const dotMatch = raw.match(/(3[4-9]|4[0-2])[.,](\d)/);
    const noDotMatch = raw.match(/(3[4-9]|4[0-2])(\d)/);

    if (dotMatch) {
      tempVal = `${dotMatch[1]}.${dotMatch[2]}`;
    } else if (noDotMatch) {
      tempVal = `${noDotMatch[1]}.${noDotMatch[2]}`;
    }

    if (tempVal) {
      document.getElementById("in-temp").value = tempVal;
      const prevComment = document.getElementById("in-comment").value.trim();
      const ocrNote = `📸 Odczyt OCR termometru: ${tempVal}°C`;
      document.getElementById("in-comment").value = prevComment ? `${prevComment} | ${ocrNote}` : ocrNote;
      showSmartStatus(`✅ <strong>Odczytano temperaturę:</strong> ${tempVal}°C (surowy odczyt: „${raw}”)`, "#10b981");
    } else {
      showSmartStatus(`⚠️ Nie rozpoznano temperatury. Surowy odczyt OCR: „${raw || "brak"}”. Zrób wyraźniejsze zbliżenie.`, "#f59e0b");
    }
  } catch (err) {
    showSmartStatus(`⚠️ Błąd OCR: ${err.message}`, "#ef4444");
  } finally {
    input.value = "";
  }
}


    
    window.addEventListener("DOMContentLoaded", initMobLogin);
  </script>
</body>
</html>
