<svg xmlns="http://w3.org" width="64" height="64" viewBox="0 0 64 64">
  <!-- 100% nieprzezroczyste ciemne tło na całą powierzchnię -->
  <rect x="0" y="0" width="64" height="64" fill="#05070A"/>
  
  <!-- Gruba neonowa ramka układu -->
  <rect x="4" y="4" width="56" height="56" rx="10" fill="#0D1117" stroke="#39FF14" stroke-width="5"/>
  
  <!-- Grube piny u góry i u dołu (czytelne w 16x16 px) -->
  <rect x="17" y="4" width="6" height="10" fill="#39FF14"/>
  <rect x="29" y="4" width="6" height="10" fill="#39FF14"/>
  <rect x="41" y="4" width="6" height="10" fill="#39FF14"/>

  <rect x="17" y="50" width="6" height="10" fill="#39FF14"/>
  <rect x="29" y="50" width="6" height="10" fill="#39FF14"/>
  <rect x="41" y="50" width="6" height="10" fill="#39FF14"/>

  <!-- Duże, pogrubione litery WC -->
  <text x="32" y="40" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="23" fill="#39FF14" text-anchor="middle">WC</text>
</svg>
