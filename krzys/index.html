<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ys (Krzyś) — Junior Tester | Wojciech Czyżyk</title>
  <link rel="icon" type="image/png" href="../favicon_wc.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <a href="../index.html" class="btn-link">← Powrót do strony Taty</a>
    </div>

    <!-- LISTA SEKCJI (Aby dodać nową ramkę, skopiuj 1 linijkę <section...> poniżej!) -->
    <section class="card" data-plik="sekcje/powitanie.html"></section>

    <!-- Kafelek Zaproszenie do Minigry QA -->
    <section class="card" style="border: 2px solid #10b981; text-align: center;">
      <img src="ys_qa_tester.jpg" alt="Ys — Junior QA Tester w akcji z lupą, tabletem i kotami" style="width: 100%; max-height: 280px; object-fit: cover; border-radius: 12px; display: block; margin-bottom: 12px;">
      <h3 style="margin: 0 0 6px 0; color: #34d399;">🐛 Laboratorium QA: Bug Hunter &amp; Hotfix Sprint</h3>
      <p style="margin: 0 0 12px 0; font-size: 0.92rem; color: #cbd5e1;">
        Złap wszystkie błędy i robaki z tablicy Kanban zanim trafią na produkcję, ale uważaj na zielony kod Baty!
      </p>
      <a href="gra-bug-hunter/index.html" class="btn-link" style="background: #10b981; color: #020617; padding: 10px 20px; border-radius: 12px; text-decoration: none; font-weight: 800; display: inline-block;">
        🚀 Uruchom Grę QA Testera →
      </a>
    </section>

    <section class="card" data-plik="sekcje/minecraft.html"></section>
    <section class="card" data-plik="sekcje/wyzwania.html"></section>
  </div>

  <script>
    // Silnik ładujący każdą ramkę z osobnego pliku
    document.querySelectorAll("[data-plik]").forEach(async (ramka) => {
      const plik = ramka.getAttribute("data-plik");
      const odp = await fetch(plik);
      ramka.innerHTML = odp.ok ? await odp.text() : `<p>Brak pliku: ${plik}</p>`;
    });

    function toggleQuest(btn) {
      btn.classList.toggle("done");
      btn.textContent = btn.classList.contains("done") ? "✅ Zaliczono! (+100 XP)" : "⬜ Zaliczone? Kliknij!";
    }
  </script>
</body>
</html>
