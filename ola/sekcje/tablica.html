<h2>🖍️ Moja Tablica do Rysowania Palcem</h2>
<p>Wybierz kolor kredki i narysuj coś fajnego na tablecie lub telefonie:</p>
<div class="canvas-wrap">
  <canvas id="ola-canvas"></canvas>
</div>
<div class="tools">
  <button class="color-btn" style="background:#ec4899;" onclick="setColor('#ec4899', 6)" title="Różowy"></button>
  <button class="color-btn" style="background:#a855f7;" onclick="setColor('#a855f7', 6)" title="Fioletowy"></button>
  <button class="color-btn" style="background:#38bdf8;" onclick="setColor('#38bdf8', 6)" title="Niebieski"></button>
  <button class="color-btn" style="background:#10b981;" onclick="setColor('#10b981', 6)" title="Zielony"></button>
  <button class="color-btn" style="background:#f59e0b;" onclick="setColor('#f59e0b', 6)" title="Żółty"></button>
  <button class="color-btn" style="background:#ef4444;" onclick="setColor('#ef4444', 6)" title="Czerwony"></button>
  <button class="action-btn" style="background:#e2e8f0; color:#0f172a;" onclick="setColor('#ffffff', 22)">🧽 Gumka</button>
  <button class="action-btn" style="background:#f43f5e; color:#fff;" onclick="clearCanvas()">🗑️ Wyczyść kartkę</button>
</div>
